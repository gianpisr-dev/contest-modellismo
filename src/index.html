<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Galleria di modellismo - Contest Modellismo">
    <title>Contest Modellismo</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="app">
        <!-- Main content will be rendered here -->
        <header class="header">
            <nav class="navbar">
                <div class="container">
                    <h1 class="logo">🎨 Contest Modellismo</h1>
                    <ul class="nav-links">
                        <li><a href="#home">Home</a></li>
                        <li><a href="#gallery">Galleria</a></li>
                        <li><a href="#about">Chi Siamo</a></li>
                        <li><a href="#contact">Contatti</a></li>
                    </ul>
                </div>
            </nav>
        </header>

        <main class="main-content">
            <!-- Hero Section -->
            <section id="home" class="hero">
                <div class="container">
                    <h2>Benvenuto nel mondo del Modellismo</h2>
                    <p>Condividi e scopri i migliori modelli della comunità</p>
                    <button class="btn btn-primary">Esplora Galleria</button>
                </div>
            </section>

            <!-- Gallery Section -->
            <section id="gallery" class="gallery">
                <div class="container">
                    <h2>Galleria Modelli</h2>
                    <div class="gallery-grid" id="gallery-grid">
                        <!-- Models will be loaded here -->
                        <div class="gallery-item placeholder">
                            <p>Nessun modello disponibile</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="container">
                <p>&copy; 2024 Contest Modellismo. Tutti i diritti riservati.</p>
            </div>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
